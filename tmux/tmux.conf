# Use Ctrl-a instead of Ctrl-b as the tmux prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Mouse support
set -g mouse on
set -g mode-keys vi

bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-and-cancel "pbcopy"

# Better terminal support
set -g default-terminal "tmux-256color"

# Scrollback
set -g history-limit 10000

# Faster escape sequences
set -g escape-time 0

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# ============================================================
# Status bar
# ============================================================

set -g status-position top
set -g status-interval 5

set -g status-style "bg=#1e2030,fg=#a6accd"

set -g status-left-length 30
set -g status-left "#[fg=#89b4fa,bold]  #S #[fg=#6c7086]│"

set -g window-status-format \
    "#[fg=#6c7086] #I:#W "

set -g window-status-current-format \
    "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

set -g window-status-separator ""

set -g status-right \
    "#[fg=#6c7086]│ #[fg=#a6e3a1] %H:%M #[fg=#6c7086]%d-%b "

# TPM
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save/restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save every 15 minutes
set -g @continuum-save-interval '15'

# Restore automatically when tmux starts
set -g @continuum-restore 'on'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Clear current pane + tmux scrollback
bind-key -n C-l send-keys C-l \; clear-history